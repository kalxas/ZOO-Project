name: Docker Image CI websocketd

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push multi-platform image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        pull: true
        file: docker/websocketd/Dockerfile
        platforms: linux/amd64,linux/arm64
        tags: |
          zooproject/websocketd:${{ github.sha }}
          zooproject/websocketd:latest
        cache-from: type=gha,scope=websocketd
        cache-to: type=gha,scope=websocketd,mode=max
    - name: Build and push latest

      uses: docker/build-push-action@v4
